mapping:
  conda_env: barragan-mapping
  threads: 8
  # minimap2 preset for long-read isolate mapping; see
  # config/samples_longread.tsv "platform" column (nanopore -> map-ont,
  # pacbio -> map-pb), resolved per-sample in workflow/rules/mapping.smk.

# PAV thresholds (Section 1 of the POC guideline). Starting values from the
# guideline; calibrate against known mini-chromosome regions (mChrA,
# Barragan et al. 2024) once real data is available - see
# Dokumentation/POC Workflow ... .md, "Kalibrierung & Erfolgskriterien".
pav:
  present_breadth: 0.85
  present_depth: 5
  absent_breadth: 0.15

starfish:
  # Reusing the existing starfish_env from earlier project work (already
  # has starfish, minimap2, metaeuk, hmmer) rather than building a
  # redundant new environment from envs/starfish.yaml.
  conda_env: starfish_env
  profile: /home/flori/miniforge3/envs/starfish_env/db/YRsuperfams.p1-512.hmm
  proteins: /home/flori/miniforge3/envs/starfish_env/db/YRsuperfamRefs.faa
  idtag: YR
  threads: 8
  separator: "-"

clustering:
  k: 4 # number of known host lineages (rice, wheat, finger millet, wild grass)
  n_components: 10
  # Modified z-score (median/MAD-based) cutoff for classify_region_discordance():
  # a candidate region scores "discordant" if its per-region ARI is more than
  # this many robust standard deviations below the batch median. Calibrated
  # against synthetic data (docs/decisions.md): best sensitivity/false-positive
  # tradeoff found at z=0.5 for small (~5-region) candidate batches, but even
  # so this absolute-threshold classification is markedly less sensitive than
  # simply ranking regions by per-region ARI (see candidate_per_region_ari.tsv,
  # sort ascending) - prefer the ranking for small POC-scale candidate counts.
  discordance_z_threshold: 0.5
