project_name: barragan_hgt

# Must not occur inside any isolate/sample ID (e.g. NCBI accessions like
# GCA_004346965.1 already contain '_'), otherwise starfish cannot reliably
# split "<genomeID><separator><featureID>" back apart.
separator: "-"

pilot_samples:
  - GCA_004346965.1
  - GCA_004785725.2
  - GCA_046718735.1

starfish:
  conda_env: starfish_env
  profile: /home/flori/miniforge3/envs/starfish_env/db/YRsuperfams.p1-512.hmm
  proteins: /home/flori/miniforge3/envs/starfish_env/db/YRsuperfamRefs.faa
  idtag: YR
  threads: 6

# windowmasker (NCBI BLAST+) is already installed in starfish_env. It gives
# a library-free, genome-self-content repeat_fraction proxy - not a curated
# TE-family annotation (see workflow/scripts/calculate_contig_metrics.py).
repeat_masking:
  conda_env: starfish_env

# minimap2 is already installed in starfish_env. Used for a per-isolate
# self-vs-self genome alignment (workflow/scripts/compute_core_synteny.py)
# to check whether a small contig shows broad collinearity with a core
# chromosome of the same isolate. asm5 = assembly-to-assembly, ~5%
# divergence preset, appropriate for same-genome/same-species alignment.
alignment:
  conda_env: starfish_env
  minimap2_preset: asm5
  minimap2_num_secondary: 5
  threads: 4
  # Cross-lineage alignment against the reference panel (config/references.yaml)
  # can see more divergence than the same-genome self-alignment above, so it
  # gets its own, looser preset.
  reference_minimap2_preset: asm20
  # Fraction of a query contig's length that must align to a SINGLE core
  # contig of a reference (not summed across several) to count as a "hit"
  # against that reference.
  min_coverage_per_reference: 0.3
  # Alignment blocks below this mapping quality are excluded from synteny
  # coverage - they indicate ambiguous/repetitive (multi-mapping) matches
  # rather than confident 1:1 synteny. See docs/decisions.md for the case
  # that motivated this (a repeat family inflating apparent core synteny).
  min_mapq: 30

# Assembly-level QC (BUSCO completeness + QUAST contiguity), establishing a
# comparable quality baseline across the pilot isolates and the reference
# panel. Assembly-only: no raw reads are available for any of these genomes
# (already-assembled NCBI submissions), so no read-QC/assembly/polishing
# step is applicable here.
qc:
  conda_env: qc_env
  busco_lineage: sordariomycetes_odb10
  threads: 4

# First-pass, provisional mChr classification thresholds
# (workflow/scripts/define_mchr_candidates.py). Dataset-dependent; expect to
# recalibrate as more isolates and evidence types are added.
#
# Size thresholds reflect published M. oryzae biology: mini-chromosomes are
# supernumerary, repeat-rich, gene-poor accessory chromosomes with sizes
# roughly from a few hundred kb up to ~3 Mb. A contig below
# small_max_length_bp is therefore evaluated as a candidate; one at/above
# core_min_length_bp is treated as core. Contigs strictly between the two
# thresholds (i.e. 3-4 Mb here) are an intentional gray zone ("uncertain")
# rather than being forced into either class.
mchr:
  core_min_length_bp: 4000000
  small_max_length_bp: 3000000
  gc_deviation_threshold: 0.03
  repeat_enrichment_threshold: 0.10
  gene_density_ratio_threshold: 0.5
  # Canonical (TTAGGG)n fungal telomere repeat, scanned within this many bp
  # of each contig end. Real M. oryzae telomeres in the pilot showed 18-31
  # tandem repeat units vs. 0-1 for non-telomeric ends - clear separation.
  telomere_window_bp: 1000
  telomere_min_repeats: 5
  # core_synteny_coverage (fraction of a contig's length collinear with a
  # different, core-sized contig via minimap2 self-alignment, see
  # compute_core_synteny.py). >= veto forces "uncertain" (likely a core
  # chromosome fragment/duplicate, not a distinct element); < low_threshold
  # is required (together with >=2 evidence lines and telomeres at both
  # ends) for high_confidence_mChr.
  core_synteny_veto_coverage: 0.5
  core_synteny_low_threshold: 0.1
