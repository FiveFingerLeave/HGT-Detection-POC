# Multi-reference panel for core/synteny consensus and accessory (mChr)
# candidate detection. Build strategy (see docs/decisions.md):
#
# - "structural" tier: chromosome-level or good long-read (Nanopore)
#   assemblies. Used to reconstruct core chromosomes, mini-chromosomes,
#   synteny and structural variants. A contig is treated as core if it is
#   collinear with at least `consensus_min_hits` of these references.
# - "supplementary" tier: older or more fragmented assemblies (short-read,
#   Scaffold-level). Used only to extend lineage/host sequence diversity
#   (presence/absence, coverage signals) - NOT for structural placement or
#   the core-synteny consensus.
# - "known_accessory_contigs": specific contigs within a structural-tier
#   reference that are themselves documented/suspected accessory elements
#   (e.g. a published mini-chromosome) and must therefore be excluded from
#   that reference's own core-chromosome set, or they would wrongly count
#   as "core" in the consensus.

consensus_min_hits: 2

structural:
  - reference_id: 70-15
    accession: GCA_000002495.2
    fasta: assemblies/ncbi_dataset/ncbi_dataset/data/GCA_000002495.2/GCA_000002495.2_MG8_genomic.fna
    gff: assemblies/ncbi_dataset/ncbi_dataset/data/GCA_000002495.2/genomic.gff
    host: Oryza sativa
    lineage_note: "Classic rice reference anchor (International Rice Blast Genome Consortium); only panel member with curated NCBI annotation - primary source for annotation transfer."

  - reference_id: Guy11
    accession: GCA_046718735.1
    fasta: assemblies/ncbi_dataset/ncbi_dataset/data/GCA_046718735.1/GCA_046718735.1_KSU_PyrO_Guy11_1_genomic.fna
    gff: null
    host: Oryza sativa
    lineage_note: "Widely used rice lab reference strain, high-quality chromosome-level Nanopore assembly."

  - reference_id: B71
    accession: GCA_004785725.2
    fasta: assemblies/ncbi_dataset/ncbi_dataset/data/GCA_004785725.2/GCA_004785725.2_ASM478572v2_genomic.fna
    gff: null
    host: Triticum aestivum
    lineage_note: "Central wheat blast (MoT) reference. Carries a documented mini-chromosome - see known_accessory_contigs below."

  - reference_id: CD156
    accession: GCA_900474475.3
    fasta: assemblies/ncbi_dataset/ncbi_dataset/data/GCA_900474475.3/GCA_900474475.3_CD156_genome_polished_no_mito_genomic.fna
    gff: null
    host: Eleusine coracana
    lineage_note: "Eleusine (finger millet) lineage, Nanopore assembly (27 contigs; NCBI labels it 'Contig' level but it is near-chromosome-scale)."

  - reference_id: US71
    accession: GCA_900474175.3
    fasta: assemblies/ncbi_dataset/ncbi_dataset/data/GCA_900474175.3/GCA_900474175.3_US71_genome_polished_no_mito_genomic.fna
    gff: null
    host: Setaria italica
    lineage_note: "Setaria lineage, Nanopore assembly (55 contigs)."

supplementary:
  - reference_id: BdMeh16
    accession: GCA_001675605.1
    fasta: assemblies/ncbi_dataset/ncbi_dataset/data/GCA_001675605.1/GCA_001675605.1_ASM167560v1_genomic.fna
    gff: null
    host: Triticum aestivum
    lineage_note: "2016 Bangladesh wheat blast outbreak isolate (global MoT expansion). Older Newbler/454 Scaffold-level assembly - diversity only, not used for structural placement."

  - reference_id: EI9411
    accession: GCA_001548775.1
    fasta: assemblies/ncbi_dataset/ncbi_dataset/data/GCA_001548775.1/GCA_001548775.1_EI9411_genomic.fna
    gff: null
    host: Eleusine coracana
    lineage_note: "Second Eleusine sub-lineage. Illumina short-read, Scaffold-level (3088 contigs) - diversity only."

  - reference_id: EI9604
    accession: GCA_001548785.1
    fasta: assemblies/ncbi_dataset/ncbi_dataset/data/GCA_001548785.1/GCA_001548785.1_EI9604_genomic.fna
    gff: null
    host: Eleusine coracana
    lineage_note: "Second Eleusine sub-lineage. Illumina short-read, Scaffold-level (2856 contigs) - diversity only."

# HYPOTHESIS, not yet literature-confirmed: in our own pipeline run, B71's
# smallest nuclear contig CP060337.1 (1.9 Mb) was reclassified from
# core_like to uncertain once mChr size thresholds were calibrated to
# published M. oryzae biology (see docs/decisions.md, 2026-08-31 "mChr-
# Größenschwellen..."). This is consistent with it being B71's documented
# mini-chromosome, but has not been cross-checked against the source
# publication. Treat as excluded from B71's own core set pending that check.
known_accessory_contigs:
  - reference_id: B71
    contig_id: CP060337.1
    note: "Candidate documented mini-chromosome (unconfirmed - see comment above); excluded from B71's core-chromosome set for consensus purposes."
