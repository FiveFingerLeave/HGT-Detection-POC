# Prevalence thresholds rescaled from 14 to 5 references (panel reduction
# to host representatives, see docs/decisions.md 2026-09-02). Original
# (14 genomes): strict=14/14, soft=13/14=0.93, shell=3-12/14=0.21-0.86.
# With only 5 possible presence levels (1/5..5/5), the old soft_core
# threshold of 0.93 would NEVER be reached (the next level below 1.0
# is 4/5=0.80) - orthogroups with 4/5 presence would have incorrectly
# landed in "shell" instead of "soft_core". Recalibrated against the
# OrthoFinder result (13,226 orthogroups: 12,259 at 5/5, 589 at 4/5,
# 200+171 at 2-3/5, 7 at 1/5):
panel:
  strict_core_fraction: 1.00   # 5/5
  soft_core_fraction: 0.80     # 4/5
  shell_min_fraction: 0.40     # 2/5 (up to <0.80); below that (1/5=0.20) = private_accessory
  candidate_min_length_bp: 10000
  dedup_identity: 0.98
  dedup_coverage: 0.90

mapping:
  preset_ont: map-ont
  preset_hifi: map-hifi
  min_mapq_unique: 20
  min_primary_alignment_bp: 3000

pav:
  window_size_bp: 10000
  high_resolution_window_size_bp: 2000
  min_depth_present: 5
  present_breadth_core: 0.80
  present_breadth_accessory: 0.70
  absent_breadth: 0.10
  min_block_bp: 20000
  min_global_depth: 20

starship:
  min_region_length_bp: 20000
  duf3435_evalue: 1.0e-5
  require_cargo_genes: true
  require_boundary_evidence_for_high_confidence: true

rarefaction:
  n_permutations: 1000
  saturation_delta_fraction: 0.05
