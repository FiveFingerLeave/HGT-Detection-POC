# Section 6.2 (Liftoff part): lightweight environment, kept separate from
# the heavy envs/annotation.yaml (BRAKER3 needs a separate GeneMark
# license and remains blocked for now, see annotation.smk).
# Liftoff itself is a plain conda install with no license dependency.
name: multiref-liftoff
channels:
  - conda-forge
  - bioconda
dependencies:
  - liftoff
  - minimap2
  - samtools
