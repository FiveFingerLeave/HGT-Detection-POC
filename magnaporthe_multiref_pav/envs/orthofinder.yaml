# Section 7.1: orthogroups. Its own environment (kept separate from the
# heavy envs/annotation.yaml) - orthofinder, diamond, mafft, iqtree are
# plain conda installs with no license dependency, unlike BRAKER3.
# gffread is needed for proteome extraction from the Liftoff GFF3 files
# (a prerequisite for orthofinder -f).
name: multiref-orthofinder
channels:
  - conda-forge
  - bioconda
dependencies:
  - orthofinder=3.1.5
  - diamond=2.2.6
  - mafft=7.526
  - iqtree=3.1.3
  - gffread=0.12.9
