# Phase I (Section 6.3): repeat/TE annotation, kept separate from
# envs/annotation.yaml (which bundles BRAKER3/OrthoFinder/eggnog-mapper
# and would thus be a heavier, more fragile environment) - repeatmodeler
# already brings its own dependencies (RECON, RepeatScout, LTR_retriever,
# cd-hit, mafft, ninja, genometools) via the bioconda channel.
name: multiref-repeats
channels:
  - conda-forge
  - bioconda
dependencies:
  - repeatmodeler=2.0.5
  - repeatmasker=4.1.7p1
  - bedtools=2.31.1
  - seqkit=2.13.0
  - samtools=1.24
