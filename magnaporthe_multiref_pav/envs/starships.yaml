# Section 7.4: Starship-like-Kandidaten (Captain/YR-Gene). Identisch zur
# bereits funktionierenden globalen Environment `starfish_env`
# (~/promotion/barragan/envs/starfish.yaml, siehe
# Dokumentation/Starfish_bisherige_Schritte.md fuer den ersten
# erfolgreichen Testlauf) - hier als Projekt-lokale Kopie fuer
# Reproduzierbarkeit. Die HMM-/Referenzproteindatenbanken
# ($CONDA_PREFIX/db/*) kommen mit dem starfish-Conda-Paket selbst.
name: multiref-starships
channels:
  - conda-forge
  - bioconda
dependencies:
  - starfish
  - metaeuk
  - hmmer
  - mmseqs2
  - blast
  - samtools
  - minimap2
