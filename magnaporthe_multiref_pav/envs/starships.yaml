# Section 7.4: starship-like candidates (Captain/YR genes). Identical to
# the already-working global environment `starfish_env`
# (~/promotion/barragan/envs/starfish.yaml, see
# Documentation/Starfish_Progress_Log.md for the first successful
# test run) - kept here as a project-local copy for reproducibility.
# The HMM/reference protein databases ($CONDA_PREFIX/db/*) ship with the
# starfish conda package itself.
name: multiref-starships
channels:
  - conda-forge
  - bioconda
dependencies:
  - starfish
  - metaeuk
  - hmmer
  - mmseqs2
  - blast
  - samtools
  - minimap2
